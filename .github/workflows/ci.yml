name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The core on Linux is the guard rail that keeps AppKit, ImageIO and PDFKit
  # out of `ShelfCore`. Every rule that can be wrong – the EPUB reader, the
  # index schema, duplicate detection, folder names – is verified here. On the
  # first run it earned its keep three times over: `autoreleasepool` does not
  # exist in swift-corelibs-foundation, `FileManager.replaceItemAt` is not
  # implemented there either, and one expression exceeded the type checker's
  # budget on Swift 6.1.
  core-linux:
    name: ShelfCore tests (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      # GRDB reaches the system SQLite through a `systemLibrary` target on
      # Linux, so the headers have to be there. Ubuntu's libsqlite3 is built
      # with FTS5, which the index needs.
      - name: Install SQLite headers
        run: apt-get update && apt-get install -y libsqlite3-dev
      - run: swift build
      - run: swift test

  # The same core on the platform Shelf ships on. `ShelfCore` has no dependency
  # on SlateKit at all, which is why it could be trusted while the app build
  # was being skipped.
  core-macos:
    name: ShelfCore tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode.app
      - run: swift --version
      - run: swift test

  # The app, built the way `make app` builds it. SlateKit is a public package
  # now (Erikemmer/SlateKit), so this needs no credentials and no `insteadOf`
  # rewrite — SwiftPM resolves it over plain HTTPS like any other dependency.
  #
  # It used to gate itself on a `SLATEKIT_TOKEN` secret and skip with a warning
  # when there was none, which meant it had never actually run: from Sprint 1
  # to Sprint 8 the only thing guarding the *window* was a build on Erik's own
  # Mac. Unsigned, because a runner has no Developer ID and this job asks
  # "does it compile and link", not "is it shippable" — `Scripts/release.sh`
  # is what asks the second question.
  app-macos:
    name: App build (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode.app
      - name: Install XcodeGen
        run: brew install xcodegen
      # The project is generated from project.yml and is not in the repository
      # (CLAUDE.md), so it has to be made here before anything can build it.
      - name: Generate the project
        run: xcodegen generate
      - name: Build app (unsigned)
        run: >
          xcodebuild -project Shelf.xcodeproj -scheme Shelf -configuration Debug
          CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build
