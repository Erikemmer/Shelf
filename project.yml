# XcodeGen project description. Run `xcodegen` (or `make project`) to create
# Shelf.xcodeproj – the .xcodeproj itself is generated and not committed.
name: Shelf
options:
  bundleIdPrefix: de.erikemmer
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

packages:
  ShelfCore:
    path: .
  # The look, shared with Selector. Pinned to a tag, never to a path: an edit in
  # the SlateKit working copy must not silently change what this app builds.
  # Raising it is a deliberate step – see docs/HANDOFF.md.
  SlateKit:
    url: https://github.com/Erikemmer/SlateKit
    exactVersion: 0.4.1
  # Update checking (Sprint 14). Source stays in this repo, which is already
  # public; only builds and the appcast are public *separately*, in
  # Erikemmer/shelf-releases – see docs/adr/0022-updates-separate-delivery-sparkle.md.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Raised past 1.0.0 on purpose (Sprint 14, Teil D): main is well past the
    # v1.0.0 tag by now (writing into an EPUB, Remove Cover, a clean quit,
    # Sparkle itself) and publishing that under "1.0.0" would put a different
    # app under the same number as the tag. The rule against touching
    # MARKETING_VERSION casually is lifted for a real release, and only for
    # that. Raised again for Sprint 15, Teil C's second release, the one
    # that proves a beta channel with two versions in it actually works —
    # still a pre-release (beta channel only) until Erik promotes it.
    MARKETING_VERSION: "1.1.0-rc2"
    CURRENT_PROJECT_VERSION: "3"
    # Follows whether a Developer ID identity was found at build time –
    # `make app`/`Scripts/release.sh` set SHELF_HARDENED accordingly, the same
    # way they already choose between a real signature and an ad-hoc one. An
    # ad-hoc build has no real team for the app and the embedded
    # Sparkle.framework to share, so turning Hardened Runtime on for one would
    # make its library validation refuse to load the other (`dyld: …
    # different Team IDs`). Off by default so a bare `xcodebuild`/⌘R still
    # works; always off for `make app-debug` too, since neither overrides it.
    SHELF_HARDENED: NO
    ENABLE_HARDENED_RUNTIME: $(SHELF_HARDENED)
    CODE_SIGN_STYLE: Automatic
    # The Sparkle EdDSA public key (base64), from `generate_keys --account
    # shelf` – safe to commit, it only lets Shelf *verify* an update's
    # signature, never produce one. The private half stays in the keychain
    # only, account "shelf"; see CLAUDE.md and docs/RUNBOOK.md.
    SPARKLE_PUBLIC_ED_KEY: "4nZaq+Rd3IeA3c1AAqNoFUAKpnTL/Y28iEUV4izruwU="
    # The git commit this build was made from, stamped into the app's own
    # Info.plist below (CFBundleShortVersionString does the same trick for
    # MARKETING_VERSION) — never a build phase that edits the bundle after
    # Xcode has already signed it, which corrupts the signature. The
    # Makefile overrides this on the command line (`xcodebuild …
    # SHELF_BUILD_COMMIT=…`); a build started any other way (Xcode's own
    # ⌘B) gets this placeholder, which `Scripts/current-shelf-app.sh` reads
    # as "no real stamp" rather than a false match.
    SHELF_BUILD_COMMIT: unknown

targets:
  Shelf:
    type: application
    platform: macOS
    sources:
      - path: App/Shelf
    dependencies:
      - package: ShelfCore
      - package: SlateKit
      - package: Sparkle
        product: Sparkle
    entitlements:
      path: App/Shelf/Resources/Shelf.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # Sparkle's installer runs outside the sandbox (it has to replace the
        # app bundle itself); the sandboxed app cannot even address it without
        # this Mach lookup exception. `-spks`/`-spki` are Sparkle's own fixed
        # suffixes for its launcher and status services, not a broader grant.
        # No downloader-service entitlement needed: Shelf already carries
        # `network.client` below, for the online-metadata lookups, so Sparkle
        # uses that directly instead of its own separately sandboxed
        # Downloader XPC service.
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
        # The library folder and the books inside it are reached through the
        # open panel and then through a security-scoped bookmark. Read-write,
        # because Shelf writes its own `.shelf/` folder and `metadata.opf` –
        # never a book file (CONCEPT §1).
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        # Devices (Sprint 5, CONCEPT §8). A sandboxed app cannot see a
        # mounted Kobo or Kindle at all without this, however much the user
        # plugged it in themselves — there is no open panel in the way and
        # nothing to hang a bookmark on. Read *and* write, because sending a
        # book to a reader is the feature; the library is what is never
        # written to from here.
        com.apple.security.files.removable-volumes.read-write: true
        # Online metadata (Sprint 6, CONCEPT §9). Outgoing only, and only to
        # Open Library and Google Books, on an explicit ⌘E. Without it every
        # lookup fails with "the request did not get an answer" and the reason
        # is invisible — the sandbox refuses the connection before URLSession
        # ever gets a socket. There is no server entitlement: Shelf listens for
        # nothing (CONCEPT §12, no content server in v1.0).
        com.apple.security.network.client: true
    info:
      path: App/Shelf/Resources/Info.plist
      properties:
        CFBundleName: Shelf
        CFBundleDisplayName: Shelf
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # See the comment on SHELF_BUILD_COMMIT above.
        ShelfBuildCommit: $(SHELF_BUILD_COMMIT)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 Erik Emmer"
        # English and German (CONCEPT §3.4). Named here as well as carried by
        # the string catalogue, because this is the list macOS matches the
        # reader's preferred languages against: without `de` a German Mac is
        # given the development region and the catalogue is never consulted.
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, de]
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        # Sparkle 2 (docs/adr/0022-…). Checks automatically; never installs
        # without asking (SUAutomaticallyUpdate false) – "Check for Updates…"
        # and the welcome-screen banner are how an update is actually applied.
        SUFeedURL: https://raw.githubusercontent.com/Erikemmer/shelf-releases/main/appcast.xml
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: false
        # Required for every sandboxed app – lets Sparkle install outside the
        # sandbox through its own Installer.xpc. No SUEnableDownloaderService:
        # Shelf's own `network.client` entitlement already covers the fetch.
        SUEnableInstallerLauncherService: true
        SUPublicEDKey: "$(SPARKLE_PUBLIC_ED_KEY)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.erikemmer.shelf
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  Shelf:
    build:
      targets:
        Shelf: all
    # Release, not Debug: ⌘R is how the app is actually used, and the cover
    # pipeline is the part of it most sensitive to an unoptimised build.
    # `make app-debug` is the way to get assertions and readable variables.
    run:
      config: Release
    test:
      config: Debug
      targets:
        - package: ShelfCore/ShelfCoreTests
